<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Bootstrap Forms and Navbar</title>
    <style>
        body{
            background-image: url(https://images.squarespace-cdn.com/content/v1/636b5e138fd7c9613e2a8b61/1675334640060-7C0U4PLRM6QQHY0QMMTB/OBMC+Quadrangle.jpg);
            background-size: cover;
        }
            .contact-form {
            max-width: 1000px;
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }


    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-primary navbar-dark">
  <div class="container-fluid" center>
    <a class="navbar-brand" href="#">Logo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Homepage</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact Us</a>
        </li>    
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    <div class="contact-form">
        <div class="text-center">
            <h1 class="fw-bold text-dark">Contact Us</h1>
            <p class="text-muted small"></p>Send a message below.</p>
        </div>

        <form>
            <div>
                <label for="fullName" class="form-label fw-semibold text-secondary">Full Name</label>
                <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div>
                <label for="emailAdd" class="form-label fw-semibold text-secondary">Email Address</label>
                <input type="email" class="form-control" id="emailAdd" placeholder="name@example.com" required>
            </div>

            <div>
                <label for="campusSelect" class="form-label fw-semibold text-secondary">Inquiring Campus</label>
                <select class="form-select" id="campusSelect">
                    <option selected>Select a campus...</option>
                    <option value="greenhills">Greenhills Campus</option>
                    <option value="sta-ana">Sta. Ana Campus</option>
                    <option value="fairview">Fairview Campus</option>
                    <option value="las-pinas">Las Piñas Campus</option>
                    <option value="angeles">Angeles Campus</option>
                </select>
            </div>

<div>
<form>
       <table class="table table-striped table-hover container">
    <tr>
        <th class="bg-warning text-dark" scope="col">CAMPUS</th>
        <th class="bg-warning text-dark" scope="col">NUMBER</th>
        <th class="bg-warning text-dark" scope="col">PICTURE OF CAMPUS</th>
    </tr>
    <tr>
        <td>GREENHILLS CAMPUS</td>
        <td>+63 949 833 9286</td>
        <td><img src="https://assets.modernparenting-onemega.com/wp-content/uploads/2023/06/How-Does-This-School-Applies-22Age-Appropriate22-Learning-3.jpg" height="150px" width="150px"></td>  
    </tr>    
    <tr>
        <td>STA. ANA CAMPUS</td>
        <td>+63 927 838 7004</td>
        <td><img src="https://obmontessori.orangeapps.ph/landing/obmontessori/images/Sta.%20Ana%20facad.jpg" height="150px" width="150px"></td>  
    </tr>
        <tr>
        <td>FAIRVIEW CAMPUS</td>
        <td>+63 908 561 7773</td>
        <td><img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/9804865a-f6de-47d0-b463-c569491b9621/OBMC+MONTESSORI+FV+1+-+AY+2026+FA.jpg" height="150px" width="150px"></td>  
    </tr>
        <tr>
        <td>LAS PINAS CAMPUS</td>
        <td>+63 936 098 2170</td>
        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQh1xf5gQ3U0aEFNffsCMyrjzWqoHX8kWC3AS4WbTUgmsNYidm1-aSdMUyH&s=10" height="150px" width="150px"></td>  
    </tr>
     <tr>
        <td>ANGELES CAMPUS</td>
        <td>+63 945 826 4495</td>
        <td><img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/51bf9a1b-c4fc-42b1-abe6-945af52780da/OBMC+MONTESSORI+AN+1+-+AY+2026+FA.jpg" height="150px" width="150px"></td>  
    </tr>
</table>
</div>
</div>
<footer class="bg-primary"><h1>Enroll now!</h1></footer>
</body>

</html>
